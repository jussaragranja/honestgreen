[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honestgreen"
version = "0.2.0"
description = "Detect changes that weaken a test suite: removed, weakened or modified assertions, disabled and deleted tests."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
keywords = ["testing", "qa", "ai-agents", "pytest", "junit", "jest", "vitest", "code-review"]

[project.scripts]
honestgreen = "honestgreen.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["honestgreen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/jussaragranja/honestgreen"
Issues = "https://github.com/jussaragranja/honestgreen/issues"
